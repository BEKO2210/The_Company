# Sample nginx config — disables access logging (no IPs persisted).
# Drop into /etc/nginx/conf.d/hello-card.conf and reload nginx.

server {
    listen 443 ssl http2;
    server_name your-domain.example;

    # Privacy: no access logs (DSGVO-konform).
    access_log off;
    error_log  /var/log/nginx/hello-card-error.log warn;

    # Strip identifying headers before forwarding.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Referer "";
    proxy_hide_header Server;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 5s;
    }
}
