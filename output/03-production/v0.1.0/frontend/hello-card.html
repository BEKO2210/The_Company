<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Hello-Card</title>
  <style>
    :root {
      --bg: #FAFAFA;
      --fg: #111418;
      --muted: #6B7280;
      --accent: #2E5BFF;
      --radius: 12px;
      --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.04);
      --gap: 12px;
      --space: 16px;
      --font: system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0F1115; --fg:#E8EAED; --muted:#9CA3AF; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: var(--font); font-size: 16px; line-height: 1.5;
      display: flex; align-items: center; justify-content: center;
      padding: var(--space);
    }
    .card {
      max-width: 480px; width: 100%;
      background: var(--bg); color: var(--fg);
      border: 1px solid color-mix(in oklab, var(--fg) 8%, transparent);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: calc(var(--space) * 1.5);
      display: flex; flex-direction: column; gap: var(--gap);
    }
    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    p { margin: 0; }
    .muted { color: var(--muted); }
    hr {
      border: 0; height: 1px;
      background: color-mix(in oklab, var(--fg) 10%, transparent);
      margin: var(--gap) 0;
    }
    .counter { font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .2s ease; }
    .counter.ready { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .counter { transition: none; }
    }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="hc-h1" id="hello-card" data-counter-url="/api/visit">
      <h1 id="hc-h1">Willkommen.</h1>
      <p class="muted">Schön, dass Sie hier sind.</p>
      <hr>
      <p class="counter muted" id="hc-counter" aria-live="polite" aria-busy="true">
        Diese Karte wird gezählt …
      </p>
    </section>
  </main>

  <script>
    (function () {
      const NAME_MAX = 64;
      const NAME_ALLOWED = /[^a-zA-Z0-9 .\-äöüÄÖÜß]/g;

      function getName() {
        try {
          const raw = new URLSearchParams(location.search).get("name") || "";
          const clean = raw.replace(NAME_ALLOWED, "").trim();
          return clean.slice(0, NAME_MAX);
        } catch (_) { return ""; }
      }

      const h1 = document.getElementById("hc-h1");
      const name = getName();
      // textContent (NOT innerHTML) — XSS-safe by construction
      h1.textContent = name ? "Hallo, " + name + "." : "Willkommen.";

      const counterEl = document.getElementById("hc-counter");
      const card = document.getElementById("hello-card");
      const url = card.getAttribute("data-counter-url") || "/api/visit";

      fetch(url, { method: "POST", headers: { "Accept": "application/json" }, cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("rate-limit-or-error"); return r.json(); })
        .then(function (data) {
          const n = (data && typeof data.count === "number") ? data.count : null;
          counterEl.textContent = (n !== null)
            ? "Diese Karte wurde bereits " + n.toLocaleString("de-DE") + " mal angezeigt."
            : "Diese Karte ist bereit.";
          counterEl.setAttribute("aria-busy", "false");
          counterEl.classList.add("ready");
        })
        .catch(function () {
          counterEl.textContent = "Diese Karte ist bereit.";
          counterEl.setAttribute("aria-busy", "false");
          counterEl.classList.add("ready");
        });
    })();
  </script>
</body>
</html>
